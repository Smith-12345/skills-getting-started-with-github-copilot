<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey</title>
    <link rel="stylesheet" href="journey.css">
</head>
<body>
    <!-- Navigation Header -->
    <header class="navbar">
        <div class="container">
            <div class="logo">logo</div>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="#products">Products</a>
                <a href="#collections">Collections</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
            <div class="nav-icons">
                <button class="icon-btn" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <button class="icon-btn" aria-label="Account">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
                <button class="icon-btn cart-btn" aria-label="Cart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-badge">2</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="hero-section">
            <h1 class="main-title">Our Journey</h1>
            <p class="subtitle">Key milestones in our commitment to excellence</p>
        </div>

        <!-- Timeline Section -->
        <div class="timeline-container">
            <div class="timeline-line"></div>
            
            <!-- Timeline Item 1 - Left -->
            <div class="timeline-item left">
                <div class="timeline-content">
                    <h2 class="timeline-year">2020</h2>
                    <p class="timeline-description">Founded with a vision to create exceptional jewelry</p>
                </div>
                <div class="timeline-dot"></div>
            </div>

            <!-- Timeline Item 2 - Right -->
            <div class="timeline-item right">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <h2 class="timeline-year">2021</h2>
                    <p class="timeline-description">Opened our first boutique in Abuja</p>
                </div>
            </div>

            <!-- Timeline Item 3 - Left -->
            <div class="timeline-item left">
                <div class="timeline-content">
                    <h2 class="timeline-year">2022</h2>
                    <p class="timeline-description">Launched online platform and expanded</p>
                </div>
                <div class="timeline-dot"></div>
            </div>
        </div>
    </main>

    <!-- Chat Button -->
    <button class="chat-button" aria-label="Talk with Us">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Talk with Us</span>
    </button>
</body>
</html>
